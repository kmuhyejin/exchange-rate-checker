spring:
  application:
    name: exchange-rate-checker

  datasource:
    url: jdbc:h2:mem:exchangedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

server:
  port: 8080

exchange-rate:
  api:
    base-url: https://open.er-api.com/v6
  cache:
    ttl-minutes: 10
  major-currencies: USD,EUR,JPY,GBP,CNY,KRW,AUD,CAD,CHF,HKD,SGD,SEK,NOK,DKK

logging:
  level:
    com.example.exchangerate: DEBUG
    org.springframework.web: INFO
